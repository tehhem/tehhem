      <h3 class="day_title" id="d">2026/11/11</h3>

      <div class="text">
        <p>
          町田康の”きれぎれ”を読み終えた。吉村萬壱の”ハリガネムシ”に移る
        </p>
        <p>
          遠心力に引き剥がされないようにすること。365の回転。万延元年の、それ
        </p>
        <p>
          大江健三郎の本を買ったはずが、見当たらず
        </p>
        <p>
          ”ラーメンと瞑想”を読んでからしんぱち食堂によく行く。次はアジを食べたい。
        </p>
        <p>
          家が２つに増える。一体何をしているのか。家の分裂に苛まれてきたのでは
        </p>
